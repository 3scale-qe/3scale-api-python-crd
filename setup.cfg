[metadata]
name = 3scale-api-crd
version = VERSION
description = 3scale CRD Python Client
author = Martin Kudlej
author_email = kudlej.martin@gmail.com
maintainer = Matej Dujava
maintainer_email = mdujava@redhat.com
url = https://github.com/3scale-qe/3scale-api-python-crd
license = Apache-2.0
license_files = LICENSE
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Operating System :: OS Independent
    Intended Audience :: Developers
    Topic :: Utilities
    Programming Language :: Python :: 3

[options]
packages = find:
include_package_data = True
install_requires =
    3scale-api
    openshift-client
    python-backoff

[options.packages.find]
exclude = tests

[options.extras_require]
dev =
    flake8
    mypy
    pylint
    pytest
    pytest-xdist
    pytest-order
    python-dotenv
docs = sphinx

[flake8]
max-line-length = 120
ignore = E203,W503

[mypy]
ignore_missing_imports = True
check_untyped_defs = true
local_partial_types = true
